<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Every EV Under RM 120,000 in Malaysia · 2026</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c1f;--card:#fff;--accent:#4f46e5;--muted:#8892b0;--border:#e8ecf4;--green:#059669;--red:#dc2626;--warn:#d97706}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:#1e1e2f;min-height:100vh}

/* header */
.site-hdr{background:linear-gradient(135deg,#0c0c1f 0%,#1a1a3e 100%);padding:20px 16px 0;position:sticky;top:0;z-index:100}
.site-hdr h1{font-family:'Space Mono',monospace;font-size:15px;color:#fff;letter-spacing:-.3px}
.site-hdr p{font-size:11px;color:var(--muted);margin-top:4px}
.tabs{display:flex;gap:0;margin-top:14px}
.tab-btn{flex:1;padding:10px 0;font-size:12px;font-weight:700;border:none;cursor:pointer;background:transparent;color:var(--muted);border-bottom:3px solid transparent;transition:all .2s}
.tab-btn.active{color:#fff;border-bottom-color:var(--accent);background:rgba(79,70,229,.1)}
.tab-btn:hover{color:#c8d0f0}

/* tab content */
.tab-panel{display:none;padding:14px 12px 40px}
.tab-panel.active{display:block;background:#eef0f7;min-height:80vh}

/* === CARDS TAB === */
.car-pills{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;-webkit-overflow-scrolling:touch}
.car-pills::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:5px 11px;border-radius:16px;border:none;cursor:pointer;font-size:10px;font-weight:700;font-family:'DM Sans';white-space:nowrap;background:#1c1c3a;color:#6b7db8;transition:all .15s}
.pill.active{color:#fff}

.card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 3px 18px rgba(0,0,0,.08);margin-bottom:14px}
.card-hdr{padding:12px 14px 10px;display:flex;justify-content:space-between;align-items:flex-start}
.card-hdr .lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;opacity:.65;color:#fff}
.card-hdr .name{font-size:15px;font-weight:800;color:#fff;margin-top:2px;line-height:1.2}
.card-hdr .price{font-size:17px;font-weight:800;color:#fff;text-align:right}
.card-hdr .price small{display:block;font-size:8.5px;font-weight:400;opacity:.55}

.photos{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 8px 6px}
.photo-wrap{position:relative;border-radius:8px;overflow:hidden;background:#dde1ea;aspect-ratio:16/10}
.photo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.photo-wrap .tag{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.5);border-radius:4px;padding:1px 6px;color:#fff;font-size:9px;font-weight:700}
.photo-wrap .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#aaa}
.photo-wrap .fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#eef0f5;font-size:20px}
.photo-wrap .fallback span{font-size:9px;color:#aaa;margin-top:3px}

.qstats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.qstats>div{padding:7px 4px;text-align:center;border-right:1px solid var(--border)}
.qstats>div:last-child{border-right:none}
.qstats .ql{font-size:8.5px;color:#aaa;text-transform:uppercase}
.qstats .qv{font-size:10.5px;font-weight:700;color:#111;margin-top:1px}

.note-bar{padding:8px 12px;font-size:11px;line-height:1.55;border-bottom:1px solid var(--border)}
.note-bar.warn{background:#fff8e1;color:#7a5800}
.note-bar.star{background:#e8f5e9;color:#1b5e20}
.note-bar.info{background:#f5f8ff;color:#374060}
.ncap-bar{padding:6px 12px;font-size:11px;font-weight:700;border-bottom:1px solid var(--border)}
.ncap-bar.bad{background:#fde8e8;color:#960000}
.ncap-bar.good{background:#e8f5e9;color:#1b5e20}

.acc-btn{width:100%;padding:10px 12px;background:#fff;border:none;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-family:'DM Sans';font-size:11.5px;font-weight:700;color:#111}
.acc-btn.open{background:#f4f7ff}
.acc-icon{font-size:14px;font-weight:700}
.acc-body{background:#fafbff}
.acc-row{display:flex;padding:6px 12px;border-bottom:1px solid #f2f2f2}
.acc-row .ak{width:35%;font-size:10px;color:#999;flex-shrink:0}
.acc-row .av{font-size:10.5px;color:#111;font-weight:500;line-height:1.4}

.carlist{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.carlist-hdr{padding:10px 12px;background:var(--bg);color:#fff;font-size:11px;font-weight:700}
.carlist-item{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid #eee;cursor:pointer}
.carlist-item.active{background:#eff2ff}
.carlist-item:last-child{border-bottom:none}
.carlist-thumb{width:46px;height:30px;border-radius:5px;overflow:hidden;background:#e8eaef;flex-shrink:0}
.carlist-thumb img{width:100%;height:100%;object-fit:cover}
.carlist-name{font-size:10.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carlist-sub{font-size:9px;color:#aaa;margin-top:1px}
.carlist-price{font-size:11.5px;font-weight:700;white-space:nowrap}

/* === TABLE TAB === */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.tbl{border-collapse:collapse;min-width:max-content;font-size:10px;width:100%}
.tbl th{padding:8px 8px;white-space:nowrap;background:#12122a;color:#c8d0e8;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;cursor:pointer;user-select:none;border-right:1px solid #1e1e3a;border-bottom:2px solid #2a2a50;position:sticky;top:0;z-index:2}
.tbl th:hover{background:#1a1a44}
.tbl td{padding:6px 8px;border-right:1px solid #eef;border-bottom:1px solid #eef;vertical-align:middle;background:#fff}
.tbl tr:nth-child(even) td{background:#f8f9fc}
.tbl tr:hover td{background:#f0f4ff}
.tbl .sticky-col{position:sticky;left:0;z-index:5;background:inherit}
.tbl .sticky-hdr{position:sticky;left:0;z-index:10;background:#0d0d22}
.best-cell{background:rgba(5,150,105,.1) !important}
.worst-cell{background:rgba(220,38,38,.08) !important}

.footer{margin-top:10px;font-size:8.5px;color:#bbb;line-height:1.7;padding:0 2px}
.legend{background:#fff;padding:8px 12px;border-bottom:1px solid var(--border);display:flex;gap:12px;flex-wrap:wrap;font-size:8.5px;color:#666;border-radius:12px 12px 0 0}
.legend-dot{width:10px;height:10px;border-radius:2px;border:1px solid #ddd;display:inline-block;vertical-align:middle;margin-right:3px}
</style>
</head>

];

const SECS=[
  {l:"⚡ Powertrain",f:["drive","power","torque","z100","top"]},
  {l:"🔋 Battery",f:["bat","range","acC","dcC"]},
  {l:"📐 Dimensions",f:["dim","wh"]},
  {l:"🖥 Tech & Safety",f:["info","bags","adas"]},
  {l:"📋 Ownership",f:["warr","col"]}
];
const FLAB={drive:"Drive",power:"Power",torque:"Torque",z100:"0–100",top:"Top Speed",bat:"Battery",range:"Range",acC:"AC Charge",dcC:"DC Fast",dim:"Dimensions",wh:"Wheels",info:"Screen",bags:"Airbags",adas:"ADAS",warr:"Warranty",col:"Colours"};

let sel=0, openSec=null;

function switchTab(t){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===(t==='cards'?0:1)));
  document.getElementById('cards-panel').classList.toggle('active',t==='cards');
  document.getElementById('table-panel').classList.toggle('active',t==='table');
  if(t==='table') renderTable();
}

function selectCar(i){sel=i;openSec=null;renderCards();window.scrollTo({top:0,behavior:'smooth'});}
function toggleSec(i){openSec=openSec===i?null:i;renderCards();}

function imgHtml(src,label){
  const id='img'+Math.random().toString(36).slice(2,8);
  setTimeout(()=>{
    const el=document.getElementById(id);
    if(!el)return;
    const img=el.querySelector('img');
    if(img){
      img.onload=()=>{el.querySelector('.loading')&&(el.querySelector('.loading').style.display='none');img.style.display='block'};
      img.onerror=()=>{el.querySelector('.loading')&&(el.querySelector('.loading').style.display='none');el.querySelector('.fallback')&&(el.querySelector('.fallback').style.display='flex')};
    }
  },50);
  return`<div class="photo-wrap" id="${id}">
    <div class="loading">loading…</div>
    <div class="fallback" style="display:none">${label==='Exterior'?'🚘':'🪑'}<span>${label}</span></div>
    <img src="${src}" alt="${label}" style="display:none">
    <div class="tag">${label}</div>
  </div>`;
}

function renderCards(){
  const c=cars[sel], clr=BC[c.brand]||'#444';
  const noteClass=c.note.startsWith('⚠️')?'warn':c.note.startsWith('⭐')?'star':'info';
  let dim=`${c.L}×${c.W}×${c.H}`;
  if(c.wb)dim+=` · WB${c.wb}`;
  if(c.gc)dim+=` · GC${c.gc}`;
  c.dim=dim;

  let secHtml='';
  SECS.forEach((s,si)=>{
    const isOpen=openSec===si;
    secHtml+=`<button class="acc-btn${isOpen?' open':''}" onclick="toggleSec(${si})"><span>${s.l}</span><span class="acc-icon" style="color:${clr}">${isOpen?'−':'+'}</span></button>`;
    if(isOpen){
      secHtml+='<div class="acc-body">';
      s.f.forEach(k=>{secHtml+=`<div class="acc-row"><div class="ak">${FLAB[k]||k}</div><div class="av">${c[k]||'N/A'}</div></div>`});
      secHtml+='</div>';
    }
  });

  let ncapHtml='';
  if(c.ncap&&c.ncap!=='—'){
    const bad=c.ncap.includes('0');
    ncapHtml=`<div class="ncap-bar ${bad?'bad':'good'}">${c.ncap}</div>`;
  }

  let listHtml='';
  cars.forEach((x,i)=>{
    listHtml+=`<div class="carlist-item${sel===i?' active':''}" onclick="selectCar(${i})">
      <div class="carlist-thumb"><img src="${x.eI}" alt="" onerror="this.style.display='none'"></div>
      <div style="flex:1;min-width:0">
        <div class="carlist-name" style="font-weight:${sel===i?700:500};color:${sel===i?(BC[x.brand]||'#333'):'#111'}">${x.model}</div>
        <div class="carlist-sub">${x.body} · ${x.power} · ${x.range}</div>
      </div>
      <div class="carlist-price" style="color:${BC[x.brand]||'#333'}">${x.price}</div>
    </div>`;
  });

  let pillsHtml='';
  cars.forEach((x,i)=>{
    pillsHtml+=`<button class="pill${sel===i?' active':''}" style="${sel===i?'background:'+BC[x.brand]:''}" onclick="selectCar(${i})">${x.brand} <span style="font-weight:400;opacity:.8">${x.price}</span></button>`;
  });

  document.getElementById('cards-panel').innerHTML=`
    <div class="car-pills">${pillsHtml}</div>
    <div class="card">
      <div class="card-hdr" style="background:${clr}">
        <div><div class="lbl">${c.brand} · ${c.body} · ${c.seats} seats</div><div class="name">${c.model}</div></div>
        <div class="price"><small>OTR</small>${c.price}</div>
      </div>
      <div class="photos">${imgHtml(c.eI,'Exterior')}${imgHtml(c.iI,'Interior')}</div>
      <div class="qstats">
        <div><div class="ql">Power</div><div class="qv">${c.power}</div></div>
        <div><div class="ql">Range</div><div class="qv">${c.range}</div></div>
        <div><div class="ql">0–100</div><div class="qv">${c.z100}</div></div>
        <div><div class="ql">Drive</div><div class="qv">${c.drive}</div></div>
      </div>
      <div class="note-bar ${noteClass}">${c.note}</div>
      ${ncapHtml}
      ${secHtml}
    </div>
    <div class="carlist">
      <div class="carlist-hdr">All ${cars.length} Variants · Tap to switch</div>
      ${listHtml}
    </div>
    <div class="footer">Photos via Zigwheels.my CDN (proxied) · Prices OTR w/o insurance · *QV-E body-only, battery RM275/mth BaaS · May 2026</div>
  `;
}

// === TABLE ===
const TBL_COLS=[
  {k:'brand',l:'Brand',w:70},{k:'model',l:'Model',w:150,sticky:true},{k:'price',l:'Price',w:100},
  {k:'body',l:'Body',w:90},{k:'seats',l:'Seats',w:45},{k:'drive',l:'Drive',w:45},
  {k:'power',l:'Power',w:65},{k:'torque',l:'Torque',w:70},{k:'bat',l:'Battery',w:140},
  {k:'range',l:'Range',w:80},{k:'std',l:'Std',w:50},{k:'z100',l:'0–100',w:80},
  {k:'top',l:'Top km/h',w:60},{k:'acC',l:'AC Charge',w:120},{k:'dcC',l:'DC Charge',w:110},
  {k:'L',l:'Length',w:60},{k:'W',l:'Width',w:60},{k:'H',l:'Height',w:60},
  {k:'wb',l:'WB',w:55},{k:'gc',l:'GC',w:45},{k:'wh',l:'Wheels',w:90},
  {k:'info',l:'Screen',w:150},{k:'bags',l:'Airbags',w:55},{k:'v2l',l:'V2L',w:60},
  {k:'ncap',l:'NCAP',w:90},{k:'warr',l:'Warranty',w:180}
];
let sortKey='pn',sortDir=1;

function tblSort(k){if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1;}renderTable();}

function renderTable(){
  const sorted=[...cars].sort((a,b)=>{
    let av=a[sortKey],bv=b[sortKey];
    if(av==null)return 1;if(bv==null)return -1;
    if(typeof av==='string'&&typeof bv==='string')return sortDir*av.localeCompare(bv);
    return sortDir*(av>bv?1:av<bv?-1:0);
  });
  const maxBags=Math.max(...cars.map(c=>c.bags));
  const minBags=Math.min(...cars.map(c=>c.bags));
  const minPn=Math.min(...cars.map(c=>c.pn));
  const maxPn=Math.max(...cars.map(c=>c.pn));

  let thHtml='<tr>';
  TBL_COLS.forEach(col=>{
    const cls=col.sticky?'sticky-hdr':'';
    const arrow=sortKey===col.k?(sortDir===1?' ▲':' ▼'):' ⇅';
    thHtml+=`<th class="${cls}" style="min-width:${col.w}px" onclick="tblSort('${col.k}')">${col.l}${arrow}</th>`;
  });
  thHtml+='</tr>';

  let trHtml='';
  sorted.forEach((c,ri)=>{
    trHtml+='<tr>';
    TBL_COLS.forEach(col=>{
      let val=c[col.k]??'—';
      let cls=col.sticky?'sticky-col':'';
      if(col.k==='bags'){
        if(c.bags===maxBags)cls+=' best-cell';
        if(c.bags===minBags&&minBags<6)cls+=' worst-cell';
        if(c.bags<=2)val=c.bags+' ⚠️';
      }
      if(col.k==='pn'&&c.pn===minPn)cls+=' best-cell';
      if(col.k==='brand')val=`<span style="font-weight:700;color:${BC[c.brand]||'#333'}">${val}</span>`;
      if(col.k==='model')val=`<span style="font-weight:600">${val}</span>`;
      if(col.k==='price')val=`<b style="color:${BC[c.brand]}">${val}</b>`;
      if(col.k==='drive')val=`<span style="font-weight:600;color:${c.drive==='RWD'?'#b30000':'#003087'}">${val}</span>`;
      if(col.k==='v2l')val=`<span style="color:${c.v2l==='No'?'#aaa':'#059669'};font-weight:${c.v2l!=='No'?600:400}">${val}</span>`;
      if(col.k==='ncap'&&c.ncap.includes('0'))val=`<span style="color:#c00;font-weight:700">${val}</span>`;
      else if(col.k==='ncap'&&c.ncap.includes('5'))val=`<span style="color:#059669;font-weight:700">${val}</span>`;
      if((col.k==='L'||col.k==='W'||col.k==='H'||col.k==='wb'||col.k==='gc')&&val===0)val='—';
      trHtml+=`<td class="${cls}" style="min-width:${col.w}px;font-size:10px">${val}</td>`;
    });
    trHtml+='</tr>';
  });

  document.getElementById('table-panel').innerHTML=`
    <div class="legend">
      <div><span class="legend-dot" style="background:rgba(5,150,105,.18)"></span>Best value</div>
      <div><span class="legend-dot" style="background:rgba(220,38,38,.14)"></span>Worst value</div>
      <div>RWD = <span style="color:#b30000;font-weight:700">red</span> · FWD = <span style="color:#003087;font-weight:700">blue</span></div>
      <div>*QV-E RM80k body-only, battery RM275/mth BaaS</div>
    </div>
    <div class="tbl-wrap"><table class="tbl"><thead>${thHtml}</thead><tbody>${trHtml}</tbody></table></div>
    <div class="footer" style="margin-top:12px">Sources: Zigwheels.my · Paul Tan · SoyaCincau · AutoBuzz · Official sites · Prices OTR w/o insurance, Peninsular MY · May 2026</div>
  `;
}

// init
renderCards();
</script>
</body>
</html>
